services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-explora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-explora}
      POSTGRES_DB: ${POSTGRES_DB:-explora}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-explora}"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      EXPLORA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-explora}:${POSTGRES_PASSWORD:-explora}@db:5432/${POSTGRES_DB:-explora}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
